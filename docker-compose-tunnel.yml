name: preflight_mobile_project
services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pf_mobile_tunnel
    restart: always
    command: tunnel --no-autoupdate run --url http://host.docker.internal:${PORT:-3001} --token ${CF_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CF_TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
      - PORT=${PORT:-3001}
    networks:
      - pf_mobile_net
networks:
  pf_mobile_net:
    name: pf_mobile_net
    external: true
