name: preflight_mobile_project
services:
  postgres:
    image: postgres:18-alpine
    container_name: pf_mobile_db
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - pf_mobile_data:/var/lib/postgresql
      - ./_entrypoint:/docker-entrypoint-initdb.d
    environment:
      - TZ=Asia/Bangkok
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_APP_USER=${POSTGRES_APP_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD}
    networks:
      - pf_mobile_net
volumes:
  pf_mobile_data:
    name: pf_mobile_data
networks:
  pf_mobile_net:
    name: pf_mobile_net # Use this name exactly
