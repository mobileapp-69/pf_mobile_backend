name: preflight_mobile
services:
  backend:
    platform: linux/amd64 # This is required for Apple M1/M2 chips to build the image correctly
    container_name: pf_mobile_backend_test
    build: .
    image: preflight_mobile_backend
    ports:
      - ${PORT}:3000
    networks:
      - pf_mobile_net
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_APP_USER=${POSTGRES_APP_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_APP_PASSWORD}
    volumes:
      - ./logs:/app/logs
    post_start:
      - command:
          [
            "sh",
            "-c",
            'pnpm run db:migrate | awk ''{ print strftime("[%Y-%m-%d %H:%M:%S]"), $0; fflush(); }'' | tee -a /app/logs/migration.log',
          ]
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pf_mobile_tunnel_test
    restart: always
    command: tunnel --no-autoupdate run --url http://host.docker.internal:${PORT:-3001} --token ${CF_TUNNEL_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CF_TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
      - PORT=${PORT:-3001}
    networks:
      - pf_mobile_net
networks:
  pf_mobile_net:
    name: pf_mobile_net
    external: true
